<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Booklet — Find Doctors & Book Appointments</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
      #initial-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #FFFFFF 0%, #F8FAFC 100%);
        z-index: 999999;
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      }
      .init-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 168, 140, 0.12) 0%, rgba(0, 168, 140, 0) 70%);
        filter: blur(30px);
        animation: init-pulse 3s ease-in-out infinite;
      }
      .init-logo-box {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .init-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px dashed rgba(0, 168, 140, 0.25);
        animation: init-spin 12s linear infinite;
      }
      .init-ring-spin {
        position: absolute;
        width: 90%;
        height: 90%;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #00A88C;
        border-right-color: rgba(0, 168, 140, 0.3);
        animation: init-spin-fast 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      }
      .init-card {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 14px 35px rgba(0, 168, 140, 0.18), 0 0 0 1px rgba(0, 168, 140, 0.1);
        z-index: 2;
        padding: 10px;
        animation: init-breathe 2.4s ease-in-out infinite;
      }
      .init-card img {
        max-height: 44px;
        max-width: 44px;
        object-fit: contain;
      }
      .init-title {
        margin-top: 28px;
        font-size: 24px;
        font-weight: 900;
        color: #0F172A;
        letter-spacing: -0.8px;
        text-align: center;
        z-index: 2;
      }
      .init-title span { color: #00A88C; }
      .init-sub {
        font-size: 12px;
        color: #64748B;
        font-weight: 700;
        margin-top: 6px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-align: center;
        z-index: 2;
      }
      .init-bar {
        width: 140px;
        height: 4px;
        background: rgba(0, 168, 140, 0.12);
        border-radius: 10px;
        margin: 12px auto 0;
        overflow: hidden;
        position: relative;
        z-index: 2;
      }
      .init-bar-fill {
        position: absolute;
        top: 0; left: 0; bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #00A88C, #00D4AF);
        border-radius: 10px;
        animation: init-bar-slide 1.5s ease-in-out infinite;
      }
      @keyframes init-spin { to { transform: rotate(360deg); } }
      @keyframes init-spin-fast { to { transform: rotate(360deg); } }
      @keyframes init-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes init-pulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes init-bar-slide { 0% { left: -45%; } 50% { left: 100%; } 100% { left: -45%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader">
        <div class="init-glow"></div>
        <div class="init-logo-box">
          <div class="init-ring-outer"></div>
          <div class="init-ring-spin"></div>
          <div class="init-card">
            <img src="/doctorBookletLogo.png" alt="Doctor Booklet Logo" />
          </div>
        </div>
        <div class="init-title">Doctor <span>Booklet</span></div>
        <div class="init-sub">LOADING EXCELLENCE...</div>
        <div class="init-bar">
          <div class="init-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
