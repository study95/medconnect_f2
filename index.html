<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Booklet — Find Doctors & Book Appointments</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <!-- PRELOADER STYLES -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #website-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background: #FFFFFF;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        user-select: none;
      }

      .preloader-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 230, 153, 0.16) 0%, rgba(5, 19, 37, 0.03) 60%, transparent 75%);
        animation: ambientPulse 3s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .preloader-logo-box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      .preloader-svg {
        width: 120px;
        height: 120px;
        display: block;
        overflow: visible;
      }

      .svg-d-base {
        stroke: #051325;
        stroke-width: 26;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 8px 20px rgba(5, 19, 37, 0.15));
      }

      .svg-d-light-beam {
        stroke: #00FFB0;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 90 220;
        stroke-dashoffset: 310;
        filter: drop-shadow(0 0 8px #00FFB0) drop-shadow(0 0 14px rgba(0, 255, 176, 0.8));
        animation: lightBeamSweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .svg-d-light-glow {
        stroke: rgba(0, 255, 176, 0.4);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100 210;
        stroke-dashoffset: 310;
        filter: blur(4px);
        animation: lightBeamSweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .svg-plus-cross {
        filter: drop-shadow(0 0 12px rgba(0, 230, 153, 0.75)) drop-shadow(0 0 20px rgba(0, 230, 153, 0.4));
        animation: crossGlowPulse 2.2s ease-in-out infinite alternate;
        transform-origin: 88px 100px;
      }

      .svg-plus-arm {
        stroke: #00B875;
        stroke-width: 18;
        stroke-linecap: round;
      }

      @keyframes lightBeamSweep {
        0% { stroke-dashoffset: 310; opacity: 0.2; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { stroke-dashoffset: -310; opacity: 0.2; }
      }

      @keyframes crossGlowPulse {
        0% { transform: scale(0.97); filter: drop-shadow(0 0 6px rgba(0, 230, 153, 0.4)); }
        100% { transform: scale(1.04); filter: drop-shadow(0 0 16px rgba(0, 230, 153, 0.95)) drop-shadow(0 0 24px rgba(0, 255, 176, 0.6)); }
      }

      @keyframes ambientPulse {
        0% { transform: scale(0.92); opacity: 0.4; }
        100% { transform: scale(1.15); opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <!-- PRELOADER OVERLAY -->
    <div id="website-preloader">
      <div class="preloader-glow"></div>
      <div class="preloader-logo-box">
        <svg class="preloader-svg" viewBox="16 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="svg-d-base" d="M 56 44 H 120 A 56 56 0 0 1 120 156 H 56" />
          <path class="svg-d-light-glow" d="M 56 44 H 120 A 56 56 0 0 1 120 156 H 56" />
          <path class="svg-d-light-beam" d="M 56 44 H 120 A 56 56 0 0 1 120 156 H 56" />
          <g class="svg-plus-cross">
            <line class="svg-plus-arm" x1="88" y1="76" x2="88" y2="124" />
            <line class="svg-plus-arm" x1="64" y1="100" x2="112" y2="100" />
          </g>
        </svg>
      </div>
    </div>

    <!-- MAIN REACT ROOT -->
    <div id="root"></div>

    <!-- MAIN ENTRY POINT -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- AUTOMATIC SMOOTH FADE-OUT SCRIPT -->
    <script>
      (function() {
        var dismissed = false;
        function dismissPreloader() {
          if (dismissed) return;
          dismissed = true;
          var p = document.getElementById('website-preloader');
          if (!p) return;
          p.style.transition = 'opacity 0.5s ease, visibility 0.5s ease';
          p.style.opacity = '0';
          p.style.visibility = 'hidden';
          p.style.pointerEvents = 'none';
          setTimeout(function() {
            if (p && p.parentNode) p.parentNode.removeChild(p);
          }, 550);
        }

        // Wait until React has actually rendered content into #root
        function checkReactReady() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            // React has mounted — give it a tiny moment to paint, then dismiss
            setTimeout(dismissPreloader, 150);
          } else {
            // Not ready yet, check again in 50ms
            setTimeout(checkReactReady, 50);
          }
        }

        // Start checking after a brief initial delay (let scripts load)
        setTimeout(checkReactReady, 200);

        // Safety fallback: dismiss after 4 seconds no matter what
        setTimeout(dismissPreloader, 4000);
      })();
    </script>
  </body>
</html>
